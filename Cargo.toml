[package]
name = "phreaky"
version = "0.1.0"
edition = "2024"
description = "League LP tracker"
license = "MIT"

[dependencies]
axum = "0.8.8"
chrono = { version = "0.4.43", features = ["serde"] }
clap = { version = "4.5.56", features = ["derive"] }
color-eyre = "0.6.5"
dotenv = "0.15.0"
libsql = "0.9.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = "1.49.0"
tracing = "0.1.44"
tracing-subscriber = "=0.3.19"
